<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error (500) - PLO Survey</title>
  <link rel="stylesheet" href="/static/css/survey.css">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #EEF1EF; color: #1D2420; }
    .err-wrap { min-height: 100vh; display: flex; flex-direction: column; }
    .err-head { height: 56px; background: #FFFFFF; border-bottom: 1px solid #DDE3DF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; }
    .err-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
    .err-box { max-width: 540px; width: 100%; background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 14px rgba(20,30,25,0.06); padding: 36px 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .err-icon { width: 72px; height: 72px; border-radius: 36px; background: #FEF3C7; display: flex; align-items: center; justify-content: center; }
    .err-btn { display: inline-flex; align-items: center; justify-content: center; height: 48px; border-radius: 8px; width: 100%; background: #1F4D3A; color: #FFFFFF; font-size: 15px; font-weight: 800; text-decoration: none; border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div class="err-wrap">
    <div class="err-head">PLO Survey</div>
    <div class="err-main">
      <div class="err-box">
        <div class="err-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#D97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <h1 style="margin: 0; font-size: 24px; font-weight: 800;">500 - Server Error</h1>
        <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #5F6B65;">
          An unexpected server error occurred while processing your request. Please try again or notify your system administrator.
        </p>
        <div style="width: 100%; margin-top: 10px;">
          <a href="/" class="err-btn">
            Return to Homepage
          </a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
